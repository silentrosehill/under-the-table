<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under The Table</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link href="assets/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="cardface.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hud.css">
</head>
<body data-theme="noir">
  <header id="topbar">
    <div class="brand"><span class="brand-mark" data-ic="dice"></span><span class="brand-name">Under The Table</span> <small data-i18n>the back room</small></div>
    <div class="tb-center"><div id="roundChip"></div><div id="turnBanner" hidden></div></div>
    <div class="tb-right">
      <div id="hudTools">
        <button class="tool" id="resetViewBtn" data-tipinfo="tool-reset" data-ic="compass"></button>
        <button class="tool" id="emoteBtn" data-tipinfo="tool-emote" data-ic="chat"></button>
        <button class="tool" id="drawerBtn" data-tipinfo="tool-drawer" data-ic="log"></button>
        <button class="tool" id="muteBtn" data-tipinfo="tool-mute" data-ic="speaker"></button>
        <button class="tool" id="quitBtn" data-tipinfo="tool-quit" data-ic="door"></button>
      </div>
      <button class="tool" id="topSoundBtn" data-tipinfo="tool-sound" data-ic="speaker"></button>
      <button class="tool tool-gear" id="settingsBtn" data-tipinfo="tool-settings" data-ic="gear" aria-haspopup="dialog"></button>
    </div>
  </header>

  <!-- JOIN -->
  <section id="joinScreen" class="screen card-screen" hidden>
    <div class="panel narrow">
      <h1 class="title">Under The Table</h1>
      <p class="muted" data-i18n>Up to four at the table, from anywhere. Whoever sits down first runs the game.</p>
      <form id="joinForm">
        <input id="nameInput" maxlength="16" placeholder="Your name" data-i18n-ph="Your name" autocomplete="off" required>
        <button class="btn big" type="submit" data-i18n>Take a seat</button>
      </form>
      <div id="joinPlayers" class="mini-players"></div>
      <p id="joinMsg" class="muted"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobbyScreen" class="screen card-screen" hidden>
    <div class="panel wide">
      <h1 class="title" data-i18n>Lobby</h1>
      <div class="lobby-extras">
        <button class="btn small ghost" id="guideBtn" type="button"><span data-ic="book"></span><span data-i18n>Cards &amp; events</span></button>
        <button class="btn small ghost" id="newsBtn" type="button"><span data-ic="newspaper"></span><span data-i18n>What's new</span></button>
        <label class="scale-pick"><span data-ic="textsize"></span><span data-i18n>Text size</span> <input type="range" class="ui-scale-range" min="85" max="140" step="5" value="100" aria-label="Text size"><output class="ui-scale-out">100%</output></label>
      </div>
      <div class="mode-switch" id="modeSwitch">
        <button data-mode="ffa"><b data-i18n>Free-for-all</b><small data-i18n>Every player for themselves</small></button>
        <button data-mode="teams"><b data-i18n>2v2 Teams</b><small data-i18n>Share the win, send each other cash</small></button>
      </div>
      <div class="lobby-grid">
        <div>
          <h3><span class="h-ic" data-ic="users"></span><span data-i18n>Players</span> <span id="playerCount" class="muted"></span></h3>
          <div id="lobbyPlayers"></div>
          <div class="row lobby-tools">
            <button id="addBotBtn" class="btn small ghost"><span data-ic="robot"></span><span data-i18n>Add a bot</span></button>
            <button id="shuffleBtn" class="btn small ghost"><span data-ic="shuffle"></span><span data-i18n>Shuffle teams</span></button>
          </div>
          <h3 data-i18n>Your token</h3>
          <div id="tokenPicker" class="picker"></div>
          <h3 data-i18n>Your color</h3>
          <div id="colorPicker" class="picker"></div>
        </div>
        <div>
          <h3><span class="h-ic" data-ic="map"></span><span data-i18n>Map</span></h3>
          <div id="mapPicker" class="map-picker"></div>
          <div id="teamSettings" class="team-settings">
            <h3 data-i18n>Team rules</h3>
            <label class="slider-row"><span data-i18n>Money transfer fee</span> <b id="teamTaxLabel">15%</b>
              <input type="range" id="teamTax" min="0" max="50" step="1" value="15">
            </label>
            <p class="muted small" id="teamTaxExample"></p>
            <label class="row"><span data-i18n>Teammates pay each other</span>
              <select id="teamRent">
                <option value="full" data-i18n>full rent</option>
                <option value="half" data-i18n>half rent</option>
                <option value="none" data-i18n>no rent</option>
              </select>
            </label>
          </div>
          <h3><span class="h-ic" data-ic="sliders"></span><span data-i18n>Rules</span></h3>
          <label class="row"><span class="row-l"><span class="row-ic" data-ic="cash"></span><span data-i18n>Starting cash</span></span>
            <select id="startMoney">
              <option value="1000000">1M</option>
              <option value="1500000">1.5M</option>
              <option value="2000000">2M</option>
              <option value="3000000">3M</option>
              <option value="5000000">5M</option>
            </select>
          </label>
          <label class="row"><span class="row-l"><span class="row-ic" data-ic="hourglass"></span><span data-i18n>Game length</span></span>
            <select id="maxRounds">
              <option value="0" data-i18n>until bankruptcy</option>
              <option value="20" data-i18n>20 rounds (quick)</option>
              <option value="30" data-i18n>30 rounds</option>
              <option value="50" data-i18n>50 rounds</option>
            </select>
          </label>
          <label class="row"><span class="row-l"><span class="row-ic" data-ic="bolt"></span><span><span data-i18n>Game speed</span> <button type="button" class="info-q" data-info="speed" aria-label="What is this?">?</button></span></span>
            <select id="gameSpeed">
              <option value="relaxed" data-i18n>Relaxed</option>
              <option value="normal" data-i18n>Normal</option>
              <option value="fast" data-i18n>Fast</option>
            </select>
          </label>
          <label class="row"><span class="row-l"><span class="row-ic" data-ic="globe"></span><span data-i18n>Global event every</span></span>
            <select id="globalEvery"></select>
          </label>
          <label class="row chk"><input type="checkbox" id="events"> <span class="row-ic" data-ic="sparkle"></span><span data-i18n>Chaos events (random twists every few rounds)</span></label>
          <label class="row chk"><input type="checkbox" id="jackpot"> <span class="row-ic" data-ic="taxi"></span><span data-i18n>Taxi Company jackpot (taxes &amp; fines pile up)</span></label>
          <label class="row chk"><input type="checkbox" id="mafia"> <span class="row-ic" data-ic="fedora"></span><span data-i18n>Borrow from the Mafia (a loan when you are in debt)</span></label>
          <div id="invite"></div>
          <p id="hostNote" class="muted"></p>
          <div class="row gap">
            <button id="startBtn" class="btn big" data-i18n>Start game</button>
            <button id="leaveBtn" class="btn ghost" data-i18n>Leave</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME (3D) -->
  <section id="gameScreen" class="screen" hidden>
    <div id="scene"></div>
    <div id="hudPlayers"></div>
    <div id="eventLog" hidden></div>
    <div id="topCenter"><div id="eventBanner" hidden></div></div>
    <div id="emoteTray" hidden></div>
    <div id="actionBar">
      <div id="status"></div>
      <div id="actions"></div>
      <div id="jackpotInfo"></div>
    </div>
    <div id="turnCard" hidden></div>
    <div id="flash"></div>
    <div id="announcer" hidden></div>
    <div id="casinoPopup" hidden>
      <div class="casino-card">
        <button class="pop-x" type="button" data-ic="close" aria-label="Close"></button>
        <div class="cc-kicker"><i class="cc-icon"></i><span class="cc-where"></span></div>
        <div class="cc-title"></div>
        <div class="cc-art" data-art="casino-whim"><span class="cc-sym"></span></div>
        <div class="cc-text"></div>
        <button class="btn small cc-ok" data-i18n>OK</button>
      </div>
    </div>
    <div id="globalPopup" hidden>
      <div class="casino-card gl-card">
        <button class="pop-x" type="button" data-ic="close" aria-label="Close"></button>
        <div class="cc-kicker"><i class="cc-icon" data-ic="roulette"></i><span data-i18n>GLOBAL EVENT</span></div>
        <div class="cc-title"></div>
        <div class="cc-art"><span class="cc-sym"></span></div>
        <ul class="gl-rows"></ul>
        <button class="btn small" data-i18n>OK</button>
      </div>
    </div>
    <div id="cardFx" hidden>
      <div class="cfx-light"></div>
      <div class="cfx-card"><div class="cfx-inner"><div class="cfx-side cfx-back"></div><div class="cfx-side cfx-front"></div></div></div>
      <div class="cfx-info"><div class="cfx-who"></div><div class="cfx-text"></div><button class="btn small" data-i18n>OK</button></div>
    </div>
    <div id="handTray" hidden></div>
    <button id="handBtn" hidden></button>
    <div id="cardPick" hidden></div>
    <div id="playBanner" hidden></div>
    <aside id="drawer">
      <div id="shareCtl" hidden></div>
      <div id="tradeBanner"></div>
      <div id="feed"></div>
      <button class="btn small ghost" id="guideBtn2" type="button" data-tipinfo="tool-guide"><span data-ic="book"></span><span data-i18n>Cards &amp; events</span></button>
      <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something…" data-i18n-ph="Say something…" autocomplete="off"><button class="btn small" data-i18n>Send</button></form>
    </aside>
  </section>

  <div id="settings" hidden></div>
  <div id="news" hidden></div>

  <div id="modal" hidden><div id="modalBox"></div></div>
  <div id="toast" hidden></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "cannon-es": "./vendor/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
