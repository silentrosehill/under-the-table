<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monopoly Party</title>
  <link href="assets/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="cardface.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="noir">
  <header id="topbar">
    <div class="brand">Monopoly Party <small data-i18n>the back room</small></div>
    <div class="top-right">
    <button class="tool" id="topSoundBtn" data-tipinfo="tool-sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
    <label class="skin-picker"><span data-i18n>View</span>
      <select id="viewSelect"><option value="table" data-i18n>Table</option><option value="city" data-i18n>City</option></select>
    </label>
    <label class="skin-picker" data-tipinfo="tool-camera"><span data-i18n>Camera</span>
      <select id="camMode"><option value="cinematic" data-i18n>Cinematic</option><option value="fixed" data-i18n>Fixed</option></select>
    </label>
    <label class="skin-picker" id="labelStyleWrap" hidden><span data-i18n>Labels</span>
      <select id="labelStyle"><option value="street" data-i18n>Names on the street</option><option value="signs" data-i18n>Floating signs</option></select>
    </label>
    <label class="skin-picker scale-pick"><span data-i18n>Text size</span>
      <input type="range" class="ui-scale-range" min="85" max="140" step="5" value="100" aria-label="Text size"><output class="ui-scale-out">100%</output>
    </label>
    <label class="skin-picker"><span data-i18n>Language</span>
      <select id="langSelect"><option value="en">English</option><option value="fr">Français</option></select>
    </label>
    <label class="skin-picker"><span data-i18n>Graphics</span>
      <select id="themeSelect">
        <option value="auto">Auto</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    </div>
  </header>

  <!-- JOIN -->
  <section id="joinScreen" class="screen card-screen" hidden>
    <div class="panel narrow">
      <h1 class="title">Monopoly Party</h1>
      <p class="muted" data-i18n>Up to four at the table, from anywhere. Whoever sits down first runs the game.</p>
      <form id="joinForm">
        <input id="nameInput" maxlength="16" placeholder="Your name" data-i18n-ph="Your name" autocomplete="off" required>
        <button class="btn big" type="submit" data-i18n>Take a seat</button>
      </form>
      <div id="joinPlayers" class="mini-players"></div>
      <p id="joinMsg" class="muted"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobbyScreen" class="screen card-screen" hidden>
    <div class="panel wide">
      <h1 class="title" data-i18n>Lobby</h1>
      <div class="lobby-extras">
        <button class="btn small ghost" id="guideBtn" type="button">🂠 <span data-i18n>Cards &amp; events</span></button>
        <label class="scale-pick"><span data-i18n>Text size</span> <input type="range" class="ui-scale-range" min="85" max="140" step="5" value="100" aria-label="Text size"><output class="ui-scale-out">100%</output></label>
      </div>
      <div class="mode-switch" id="modeSwitch">
        <button data-mode="ffa"><b data-i18n>Free-for-all</b><small data-i18n>Every player for themselves</small></button>
        <button data-mode="teams"><b data-i18n>2v2 Teams</b><small data-i18n>Share the win, send each other cash</small></button>
      </div>
      <div class="lobby-grid">
        <div>
          <h3><span data-i18n>Players</span> <span id="playerCount" class="muted"></span></h3>
          <div id="lobbyPlayers"></div>
          <div class="row lobby-tools">
            <button id="addBotBtn" class="btn small ghost" data-i18n>Add a bot</button>
            <button id="shuffleBtn" class="btn small ghost" data-i18n>Shuffle teams</button>
          </div>
          <h3 data-i18n>Your token</h3>
          <div id="tokenPicker" class="picker"></div>
          <h3 data-i18n>Your color</h3>
          <div id="colorPicker" class="picker"></div>
        </div>
        <div>
          <h3 data-i18n>Map</h3>
          <div id="mapPicker" class="map-picker"></div>
          <div id="teamSettings" class="team-settings">
            <h3 data-i18n>Team rules</h3>
            <label class="slider-row"><span data-i18n>Money transfer fee</span> <b id="teamTaxLabel">15%</b>
              <input type="range" id="teamTax" min="0" max="50" step="1" value="15">
            </label>
            <p class="muted small" id="teamTaxExample"></p>
            <label class="row"><span data-i18n>Teammates pay each other</span>
              <select id="teamRent">
                <option value="full" data-i18n>full rent</option>
                <option value="half" data-i18n>half rent</option>
                <option value="none" data-i18n>no rent</option>
              </select>
            </label>
          </div>
          <h3 data-i18n>Rules</h3>
          <label class="row"><span data-i18n>Starting cash</span>
            <select id="startMoney">
              <option value="1000000">1M</option>
              <option value="1500000">1.5M</option>
              <option value="2000000">2M</option>
              <option value="3000000">3M</option>
              <option value="5000000">5M</option>
            </select>
          </label>
          <label class="row"><span data-i18n>Game length</span>
            <select id="maxRounds">
              <option value="0" data-i18n>until bankruptcy</option>
              <option value="20" data-i18n>20 rounds (quick)</option>
              <option value="30" data-i18n>30 rounds</option>
              <option value="50" data-i18n>50 rounds</option>
            </select>
          </label>
          <label class="row"><span data-i18n>Global event every</span>
            <select id="globalEvery"></select>
          </label>
          <label class="row"><input type="checkbox" id="events"> <span data-i18n>Chaos events (random twists every few rounds)</span></label>
          <label class="row"><input type="checkbox" id="jackpot"> <span data-i18n>Taxi Company jackpot (taxes &amp; fines pile up)</span></label>
          <label class="row"><input type="checkbox" id="mafia"> <span data-i18n>Borrow from the Mafia (a loan when you are in debt)</span></label>
          <div id="mafiaSettings" hidden>
            <label class="row"><span data-i18n>Loan amount</span><select id="mafiaAmount"></select></label>
            <label class="row"><span data-i18n>Turns to repay</span><select id="mafiaTurns"></select></label>
            <label class="row"><span data-i18n>Total interest</span><select id="mafiaInterest"></select></label>
          </div>
          <div id="invite"></div>
          <p id="hostNote" class="muted"></p>
          <div class="row gap">
            <button id="startBtn" class="btn big" data-i18n>Start game</button>
            <button id="leaveBtn" class="btn ghost" data-i18n>Leave</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME (3D) -->
  <section id="gameScreen" class="screen" hidden>
    <div id="scene"></div>
    <div id="hudPlayers"></div>
    <div id="eventLog" hidden></div>
    <div id="turnBanner" hidden></div>
    <div id="topCenter"><div id="roundChip"></div><div id="eventBanner" hidden></div></div>
    <div id="emoteTray" hidden></div>
    <div id="hudTools">
      <button class="tool" id="emoteBtn" data-tipinfo="tool-emote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M9 10h.01M15 10h.01"/></svg></button>
      <button class="tool" id="followBtn" data-tipinfo="tool-follow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="12" height="10" rx="1"/><path d="M15 11l6-3v8l-6-3"/></svg></button>
      <button class="tool" id="labelsBtn" data-tipinfo="tool-labels" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-7l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M7 9h10M7 12h6"/></svg></button>
      <button class="tool" id="annBtn" data-tipinfo="tool-announcer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 12h10"/></svg></button>
      <button class="tool" id="tvBtn" data-tipinfo="tool-tv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/><path d="M6 11h9M6 14h9M6 17h9"/></svg></button>
      <button class="tool" id="resetViewBtn" data-tipinfo="tool-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
      <button class="tool" id="musicBtn" data-tipinfo="tool-music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5"/></svg></button>
      <button class="tool" id="muteBtn" data-tipinfo="tool-mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
      <button class="tool" id="drawerBtn" data-tipinfo="tool-drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
      <button class="tool" id="quitBtn" data-tipinfo="tool-quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3h10v18"/><path d="M3 21h17"/><path d="M13 12h.01"/></svg></button>
    </div>
    <div id="actionBar">
      <div id="status"></div>
      <div id="actions"></div>
      <div id="jackpotInfo"></div>
    </div>
    <div id="turnCard" hidden></div>
    <div id="flash"></div>
    <div id="announcer" hidden></div>
    <div id="casinoPopup" hidden>
      <div class="casino-card">
        <div class="cc-kicker"><i class="cc-icon">🎰</i><span class="cc-where"></span></div>
        <div class="cc-title"></div>
        <div class="cc-art" data-art="casino-whim"><span class="cc-sym"></span></div>
        <div class="cc-text"></div>
        <button class="btn small" data-i18n>OK</button>
      </div>
    </div>
    <div id="globalPopup" hidden>
      <div class="casino-card gl-card">
        <div class="cc-kicker"><i class="cc-icon">🎡</i><span data-i18n>GLOBAL EVENT</span></div>
        <div class="cc-title"></div>
        <div class="cc-art"><span class="cc-sym"></span></div>
        <ul class="gl-rows"></ul>
        <button class="btn small" data-i18n>OK</button>
      </div>
    </div>
    <div id="cardFx" hidden>
      <div class="cfx-light"></div>
      <div class="cfx-card"><div class="cfx-inner"><div class="cfx-side cfx-back"></div><div class="cfx-side cfx-front"></div></div></div>
      <div class="cfx-info"><div class="cfx-who"></div><div class="cfx-text"></div><button class="btn small" data-i18n>OK</button></div>
    </div>
    <div id="handTray" hidden></div>
    <button id="handBtn" hidden></button>
    <div id="cardPick" hidden></div>
    <div id="playBanner" hidden></div>
    <aside id="drawer">
      <div id="shareCtl" hidden></div>
      <div id="tradeBanner"></div>
      <div id="feed"></div>
      <button class="btn small ghost" id="guideBtn2" type="button" data-tipinfo="tool-guide">🂠 <span data-i18n>Cards &amp; events</span></button>
      <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something…" data-i18n-ph="Say something…" autocomplete="off"><button class="btn small" data-i18n>Send</button></form>
    </aside>
  </section>

  <div id="soundPanel" hidden>
    <label><span data-i18n>Volume</span> <output id="volOut"></output><input type="range" id="volRange" min="0" max="100" step="1"></label>
    <label><span data-i18n>Record</span> <output id="musicOut"></output><input type="range" id="musicRange" min="0" max="100" step="1"></label>
    <div class="sound-row"><button class="btn small ghost" id="muteToggle"></button><button class="btn small ghost" id="musicToggle"></button></div>
  </div>

  <div id="modal" hidden><div id="modalBox"></div></div>
  <div id="toast" hidden></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "cannon-es": "./vendor/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
